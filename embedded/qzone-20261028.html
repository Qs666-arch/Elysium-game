<title>陈、陌的QQ空间 - Internet Explorer</title>
<style>
/* ============================================================
   2012 QQ空间 · 陈、陌（男生清冷版）
   主色调：深空黑 / 冷白发光 / 深海蓝 / 浅灰青 —— 零粉色零暖色
   人物：陈陌（玩家，网名陈、陌）许一然（同桌，记忆衰退）
         张伟（霸凌，已故）林斌斌（张伟小弟，顽劣，有号召力）
         林婧（班主任）+ 网友（顾辞远/营销号）
   设定：好友动态显示最近一周（2016-09-03~09-10，置顶哀悼+水滴筹）+ 末尾一条张伟旧帖（2016-07-12，死亡前一个月），
         点进个人空间可见完整历史（2013 年起）。
   路由：#/feed(个人中心,默认) #/home(小窝) #/board #/album #/blog
          #/music #/profile #/shuoshuo #/user/<id>(好友空间)
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;}
body{font:13px/1.7 "宋体",SimSun,"Microsoft YaHei","微软雅黑",Tahoma,sans-serif;background:#f3f5f8;color:#222;overflow-x:hidden;}
body.dark{background:#05070c;color:#d8e2ee;}
/* 深色皮肤：纯白空心星星光标 */
body.dark,body.dark *{cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22"><path d="M11 2 L13.6 7.4 L19.6 8.1 L15.3 12.1 L16.4 18 L11 15 L5.6 18 L6.7 12.1 L2.4 8.1 L8.4 7.4 Z" fill="none" stroke="white" stroke-width="1.3" stroke-linejoin="round"/></svg>') 11 11, crosshair;}
a{color:inherit;text-decoration:none;}
ul{list-style:none;}
button{font-family:inherit;}
.hide{display:none!important;}

/* ===== 加载遮罩（模拟老式慢加载） ===== */
#loading{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:9999;background:#f3f5f8;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#7c8ea3;font-size:12px;letter-spacing:1px;}
#loading.dark{background:#05070c;color:#3e5268;}
#loading .spin{width:26px;height:26px;border:2px solid #c9d6e2;border-top-color:#1d5a99;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== 小窝 6 秒开场（冷色重调版） ===== */
#intro{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:9998;background:radial-gradient(ellipse at 50% 30%,#0e1c30 0%,#070d18 55%,#04070d 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;opacity:1;transition:opacity .8s;}
#intro.fade{opacity:0;pointer-events:none;}
#intro .it-tt{font-size:38px;letter-spacing:10px;color:#eaf4ff;font-family:"微软雅黑","Microsoft YaHei";text-shadow:0 0 14px rgba(180,220,255,.95),0 0 42px rgba(120,180,240,.55);}
#intro .it-sub{margin-top:6px;font-size:12px;letter-spacing:6px;color:#5d7c9c;}
#intro .it-dot{position:absolute;top:-12px;width:3px;height:3px;border-radius:50%;background:#dcebfa;opacity:.7;animation:dotfall linear infinite;}
@keyframes dotfall{0%{transform:translateY(-20px);opacity:0;}12%{opacity:.85;}100%{transform:translateY(105vh);opacity:0;}}
#intro .it-skip{position:absolute;right:26px;bottom:24px;color:#8fa9c4;font-size:12px;border:1px solid #33455c;padding:4px 14px;border-radius:2px;cursor:pointer;background:rgba(10,18,30,.6);}
#intro .it-skip:hover{color:#dceaf7;border-color:#5d7c9c;}

/* ===== 顶部通栏（个人中心） ===== */
#app{display:none;min-height:100vh;}
#app.show{display:block;}
#topbar{height:34px;background:linear-gradient(#22303f,#141e2a);border-bottom:1px solid #7fa8c9;box-shadow:0 1px 5px rgba(127,168,201,.35);display:flex;align-items:center;padding:0 12px;color:#dbe7f2;}
#topbar .logo{display:flex;align-items:center;gap:7px;font-size:13px;color:#fff;letter-spacing:1px;}
#topbar .logo .star{color:#ffd24d;font-size:15px;text-shadow:0 0 6px rgba(255,210,77,.5);}
#topbar .spacer{flex:1;}
#topbar .top-btn{color:#9fb3c8;font-size:12px;padding:2px 9px;cursor:pointer;border:1px solid transparent;}
#topbar .top-btn:hover{color:#e8f2fb;border-color:#3d5a75;background:#1d2a38;border-radius:2px;}

/* ===== 个人中心三栏 ===== */
#main{width:1000px;margin:0 auto;padding:14px 0 40px;display:flex;gap:12px;align-items:flex-start;}
#colL{width:220px;flex:0 0 220px;}
#colM{flex:1;min-width:0;}
#colR{width:230px;flex:0 0 230px;}
.card{background:#fff;border:1px solid #dbe3ec;border-radius:2px;box-shadow:0 1px 2px rgba(30,50,70,.06);}
.card-h{border-bottom:1px solid #e6ebf1;padding:8px 12px;font-size:13px;font-weight:bold;color:#22384d;}

/* 左栏 */
#meBox{padding:14px 12px;text-align:center;}
#meBox .big-av{margin:0 auto 8px;width:72px;height:72px;border:1px solid #c9d6e2;background:#fff;padding:2px;border-radius:2px;display:inline-block;}
#meBox .me-nick{font-size:15px;font-weight:bold;color:#10181f;font-family:"微软雅黑";letter-spacing:1px;}
#meBox .me-sign{margin-top:4px;font-size:12px;color:#8798a9;}
#meBox .me-vip{margin-top:8px;display:flex;justify-content:center;gap:8px;font-size:11px;color:#8a6d1f;}
#meBox .me-vip .v1{color:#b8860b;}
#meBox .me-vip .v2{color:#6d7e91;}
#menu{border-top:1px solid #e6ebf1;padding:6px 0;}
#menu a{display:block;padding:6px 12px 6px 26px;font-size:13px;color:#4a5a6a;position:relative;}
#menu a:hover{color:#1d5a99;}
#menu a.on{color:#1d5a99;font-weight:bold;}
#menu a.on:before{content:"";position:absolute;left:12px;top:12px;width:6px;height:6px;background:#1d5a99;border-radius:1px;}
#pubBox{margin-top:12px;padding:10px;}
#pubBox textarea{width:100%;height:74px;border:1px solid #d4dde6;border-radius:2px;resize:none;padding:6px 8px;font:13px/1.6 "宋体",SimSun;color:#333;background:#fbfcfd;}
#pubBox textarea:focus{outline:1px solid #9fc0e0;}
#pubTools{display:flex;align-items:center;gap:6px;margin-top:6px;color:#6d7e91;font-size:12px;}
#pubTools span{padding:1px 6px;border:1px solid transparent;cursor:pointer;border-radius:2px;}
#pubTools span:hover{color:#1d5a99;border-color:#c9d6e2;background:#f2f6fa;}
#pubBtn{margin-left:auto;background:#1d5a99;color:#fff;border:none;font-size:12px;padding:4px 16px;border-radius:2px;cursor:pointer;}
#pubBtn:hover{background:#174a80;}
#myApps{margin-top:12px;}
#myApps .app-row{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12px;color:#4a5a6a;border-bottom:1px solid #eef2f6;cursor:default;}
#myApps .app-row:last-child{border-bottom:none;}
#myApps .app-row:hover{color:#1d5a99;}
#myApps .app-ico{width:16px;height:16px;flex:0 0 16px;}

/* 中栏：动态 */
.fd{position:relative;border-bottom:1px solid #e6ebf1;padding-bottom:4px;}
.fd-head{display:flex;align-items:center;gap:8px;padding:12px 14px 0;}
.fd-head .av{cursor:pointer;}
.fd-nick{font-weight:bold;font-size:13px;color:#161616;cursor:pointer;}
.fd-nick:hover{color:#1d5a99;}
.fd-text{padding:4px 14px 0 64px;font-size:13px;color:#222;line-height:1.85;white-space:pre-line;}
.fd-img{margin:8px 14px 0 64px;border:1px solid #e0e6ed;border-radius:2px;overflow:hidden;position:relative;background:#fff;}
.fd-img img{width:100%;height:190px;object-fit:cover;display:block;}
.fd-link{margin:6px 14px 0 64px;font-size:12px;color:#1d5a99;cursor:pointer;}
.fd-link:hover{text-decoration:underline;}
.fd-time{padding:8px 14px 2px 64px;color:#9aa7b5;font-size:11px;}
.fd-act{display:flex;padding:2px 14px 10px 64px;color:#6d7e91;font-size:12px;}
.fd-act span{margin-right:16px;cursor:pointer;padding:1px 4px;border-radius:2px;}
.fd-act span:hover{color:#1d5a99;}
.fd-act span.on{color:#1d5a99;}
.fd-cm{display:none;margin:0 14px 12px 64px;background:#f6f8fa;border:1px solid #e3e9f0;border-radius:2px;padding:8px 10px;font-size:12px;}
.fd-cm.open{display:block;}
.cm-item{display:flex;gap:6px;padding:4px 0;border-bottom:1px dashed #e3e9f0;color:#333;}
.cm-item:last-child{border-bottom:none;}
.cm-user{color:#1d5a99;flex:0 0 auto;}
.cm-in{display:flex;gap:6px;margin-top:8px;}
.cm-in input{flex:1;border:1px solid #d4dde6;border-radius:2px;padding:4px 8px;font:12px "宋体",SimSun;}
.cm-in button{background:#1d5a99;color:#fff;border:none;font-size:12px;padding:3px 12px;border-radius:2px;cursor:pointer;}
.lk-pop{position:absolute;background:#fff;border:1px solid #c9d6e2;box-shadow:0 2px 10px rgba(20,40,60,.18);padding:6px 10px;font-size:12px;color:#333;z-index:60;border-radius:2px;max-width:200px;}
.lk-pop b{color:#1d5a99;font-weight:normal;}
.fd-end{padding:26px 0;text-align:center;color:#9aa7b5;font-size:12px;}
.fd-end .top{color:#1d5a99;cursor:pointer;margin-left:10px;}
/* 预留照片位 */
.ph-slot{height:150px;background:#eef1f5;border:1px dashed #c9d6e2;display:flex;align-items:center;justify-content:center;color:#a4b0bc;font-size:12px;letter-spacing:2px;}

/* 右栏 */
#rVisit{padding:8px 10px 12px;}
#rVisit .v-head{font-size:12px;font-weight:bold;color:#1d5a99;padding:2px 2px 6px;}
#rVisit .v-row{display:flex;align-items:center;gap:7px;padding:4px 2px;font-size:12px;color:#333;}
#rVisit .v-row .av{cursor:pointer;}
#rVisit .v-row .nm{cursor:pointer;}
#rVisit .v-row .nm:hover{color:#1d5a99;}
#rVisit .v-cnt{margin-top:6px;padding:6px 8px;background:#f2f5f8;color:#7c8ea3;font-size:11px;border-radius:2px;}
#rStat{padding:10px 12px;font-size:12px;color:#8798a9;}
#rFlower{padding:12px 14px;text-align:center;}
#rFlower .fl-ico{animation:sway 4s ease-in-out infinite;transform-origin:bottom center;}
@keyframes sway{0%,100%{transform:rotate(-3deg);}50%{transform:rotate(3deg);}}
#rFlower .fl-name{font-size:13px;color:#3e6d94;margin-top:4px;}
#rFlower .fl-st{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 12px;margin-top:8px;font-size:11px;color:#7c8ea3;}
#rFlower .fl-lv{display:inline-block;margin-top:8px;font-size:11px;color:#4a5a6a;border:1px solid #c9d6e2;padding:1px 8px;border-radius:2px;}
#rNote{padding:10px 12px;font-size:11px;color:#a4b0bc;}

/* ===== 深色皮肤公共 ===== */
#views{display:none;min-height:100vh;}
#views.show{display:block;}
.dk-wrap{position:relative;width:1000px;margin:0 auto;min-height:100vh;}
.dk-nav{position:absolute;left:6px;top:244px;width:112px;}
.dk-nav a{display:block;padding:7px 4px 7px 14px;font-size:14px;color:#e8f1fa;letter-spacing:2px;border-left:2px solid transparent;position:relative;}
.dk-nav a:hover{color:#5f9fd8;}
.dk-nav a.on{color:#5f9fd8;border-left:2px solid #5f9fd8;}
.dk-nav .nav-tip{margin-top:14px;padding-left:14px;font-size:11px;color:#3e5268;letter-spacing:1px;line-height:2;}

/* 小窝横幅 */
.dk-banner{height:210px;background:linear-gradient(180deg,rgba(15,24,38,.94),rgba(7,11,19,.55));border-bottom:1px solid rgba(140,180,220,.16);position:relative;overflow:hidden;display:flex;align-items:center;padding:0 30px;}
.dk-banner .flow{position:absolute;top:0;bottom:0;width:38%;background:linear-gradient(100deg,transparent,rgba(150,205,245,.16) 45%,rgba(190,225,255,.30) 50%,rgba(150,205,245,.16) 55%,transparent);animation:flowmove 7s linear infinite;}
@keyframes flowmove{0%{left:-40%;}100%{left:110%;}}
.dk-name{font-size:46px;color:#fff;text-shadow:0 0 12px rgba(190,225,255,.95),0 0 34px rgba(130,190,245,.5);letter-spacing:10px;font-family:"微软雅黑","Microsoft YaHei";}
.dk-sub{margin-top:10px;color:#a9c3da;font-size:13px;letter-spacing:4px;text-shadow:0 0 8px rgba(150,200,240,.35);}
.dk-ban-r{margin-left:auto;text-align:right;display:flex;flex-direction:column;gap:10px;align-items:flex-end;}
.dk-vip{color:#b8860b;font-size:12px;text-shadow:0 0 6px rgba(184,134,11,.5);}
.dk-ban-btns{display:flex;gap:8px;}
.dk-ban-btns span{color:#8fa9c4;font-size:12px;border:1px solid #33455c;padding:3px 12px;border-radius:2px;cursor:pointer;background:rgba(10,18,30,.55);}
.dk-ban-btns span:hover{color:#dceaf7;border-color:#5d7c9c;}

/* 小窝框 */
.dk-frame{width:715px;margin:26px auto 60px;border:1px solid rgba(220,235,250,.30);border-radius:10px;background:rgba(12,18,28,.22);position:relative;padding-bottom:10px;}
.dk-mod{margin:14px 16px 0;border:1px solid rgba(200,220,240,.13);border-radius:6px;padding:12px 14px;color:#d8e2ee;position:relative;overflow:hidden;}
.dk-mod.cut{border-style:dashed;border-color:rgba(160,200,240,.5);resize:both;overflow:auto;}
.dk-mod .mod-x{display:none;position:absolute;right:4px;top:4px;color:#8fa9c4;font-size:11px;padding:0 6px;cursor:pointer;z-index:5;}
.dk-mod.cut .mod-x{display:block;}
#modStats{background:#d9e2ea;color:#1a1a1a;font-size:12px;display:flex;gap:18px;}
#modSay{color:#fff;font-size:14px;text-align:center;text-shadow:0 0 10px rgba(170,215,255,.9),0 0 26px rgba(120,180,240,.4);letter-spacing:2px;padding:16px;}
#modSay .say-sub{margin-top:8px;font-size:12px;color:#8fa9c4;letter-spacing:1px;text-shadow:none;}
#modBig{padding:0;border:none;}
#modBig .landscape{display:block;width:100%;height:auto;}
.dk-say{background:rgba(255,255,255,.88);color:#222;margin:14px 16px 0;border-radius:6px;padding:10px 14px;}
.dk-say .s-time{color:#9aa7b5;font-size:11px;margin-top:4px;}
.dk-say .s-act{display:flex;color:#6d7e91;font-size:12px;margin-top:4px;}
.dk-say .s-act span{margin-right:16px;cursor:pointer;padding:1px 4px;}
.dk-say .s-act span:hover{color:#1d5a99;}
.dk-say-sep{height:1px;border-top:1px dashed #c9d6e2;margin:0 16px;}
#modFlower{display:flex;align-items:center;gap:16px;}
#modFlower .fl-l{flex:0 0 auto;text-align:center;}
#modFlower .fl-r{font-size:12px;color:#b8cfe0;line-height:2;}
#modFlower .fl-r b{color:#e6f1fa;font-weight:normal;}
.dk-brd{background:rgba(255,255,255,.9);color:#222;margin:14px 16px 0;border-radius:6px;padding:10px 14px;font-size:12px;position:relative;}
.dk-brd .brd-item{border-bottom:1px dashed #d4dde6;padding:6px 0;display:flex;gap:8px;}
.dk-brd .brd-item:last-child{border-bottom:none;}
.dk-brd .brd-u{color:#1d5a99;flex:0 0 auto;}
.dk-brd .brd-more{margin-top:6px;color:#1d5a99;cursor:pointer;}
.dk-custom{position:absolute;top:-22px;right:0;color:#7f95ab;font-size:12px;cursor:pointer;z-index:5;}
.dk-custom:hover{color:#b8cfe0;}

/* 悬浮音乐播放器（视觉假播放，无真实音频） */
#player{position:fixed;right:16px;bottom:16px;width:252px;background:rgba(8,12,19,.86);border:1px solid rgba(160,195,230,.25);border-radius:6px;color:#cfe0f0;z-index:90;box-shadow:0 4px 18px rgba(0,0,0,.5);}
#player .pl-h{display:flex;align-items:center;gap:6px;padding:7px 10px 5px;font-size:12px;}
#player .pl-h .pl-note{color:#7fa8c9;}
#player .pl-h .pl-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#player .pl-h .pl-min{cursor:pointer;color:#5d7c9c;padding:0 4px;}
#player .pl-btns{display:flex;align-items:center;gap:10px;padding:2px 10px;}
#player .pl-btns .pb{cursor:pointer;color:#9fc4e2;font-size:11px;padding:1px 5px;border:1px solid transparent;border-radius:2px;}
#player .pl-btns .pb:hover{color:#e6f1fa;border-color:#33455c;}
#player .pl-btns .pb.play{color:#e6f1fa;font-size:13px;}
#player .pl-bar{margin:6px 12px 2px;height:3px;background:#1c2b3c;border-radius:2px;overflow:hidden;}
#player .pl-fill{height:100%;width:0;background:linear-gradient(90deg,#5f9fd8,#a8d0e6);animation:plbar 96s linear infinite;}
#player.paused .pl-fill{animation-play-state:paused;}
@keyframes plbar{0%{width:0;}100%{width:100%;}}
#player .pl-lyric{margin:4px 0 8px;padding:0 10px;font-size:11px;color:#8fa9c4;overflow:hidden;white-space:nowrap;position:relative;height:18px;}
#player .pl-lyric span{position:absolute;left:100%;animation:lymove 16s linear infinite;}
#player.paused .pl-lyric span{animation-play-state:paused;}
@keyframes lymove{0%{left:100%;}100%{left:-140%;}}

/* 子页面（深色皮肤内） */
.dk-content{width:715px;margin:26px auto 60px;}
.dk-page-t{color:#fff;font-size:16px;text-align:center;text-shadow:0 0 10px rgba(170,215,255,.85);letter-spacing:3px;padding:6px 0 14px;}

.brd-item{display:flex;gap:8px;padding:8px 0;border-bottom:1px dashed #d4dde6;font-size:13px;line-height:1.8;}

.emo-row .em{cursor:pointer;padding:2px;border:1px solid transparent;border-radius:2px;}

.alb .alb-info{padding:6px 4px;font-size:11px;color:#8fa9c4;}

.info-row:last-child{border-bottom:none;}
.info-row .ik{flex:0 0 90px;color:#8798a9;}
#logDetail{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;background:rgba(3,6,10,.75);z-index:9996;display:none;align-items:center;justify-content:center;}
#logDetail.show{display:flex;}
#logDetail .lg-box{width:520px;background:#0d1624;border:1px solid #33455c;border-radius:6px;color:#d8e2ee;padding:22px 26px;position:relative;}

  {t:'朋友约我逛街，想了想还是婉拒啦。\n出门处处要花钱，待在家里，一台旧电脑，连上网络，就能够跟随动画角色去往很远很远的地方。橘子汽水配番剧，不需要额外开销，安安稳稳度过一下午。\n有没有同好在线聊天？禁止剧透！剧透我会闷闷不乐！QAQ',d:'2014-08-02',cm:[{u:'lxd',t:'你才是真宅。'}]},
  {t:'五块钱的动漫贴纸到货！！～',d:'2014-07-28',cm:[{u:'gcy',t:'哪买的。'}]},

  {t:'快乐其实很简单！\n不用昂贵的礼物，几张贴纸、一枚新徽章、一集更新的动画，就能开心好久。\n假期不用勉强自己出门社交，安安静静追番、涂涂画画，就是我最理想的生活。坐等今晚更新，已经搓手期待一整天咯！ヽ(｡･ω･｡)ﾉ',d:'2014-07-15',cm:[{u:'lxd',t:'说得好。'}]},

  {t:'这封信我写了很多遍。删了又写，写了又删。\n对不起。我知道这三个字没用，但我不知道该说什么了\n那天中午我看到一条他问有没有人能帮忙我第一个回了......我以为只是跑个腿。\n下午在小卖部门口，他把一个用草稿纸包着的东西给我，说是在操场捡到的mp3，问了一圈好像是你的，让我悄悄\n放回你书包里不过别让你看见，说捡到东西的人不想留名。\n我当时还觉得是在做好事。我当时怎么会这么蠢。对不起我想我说一万遍对不起都没有用，你的痛苦我可能尝不到万分之一，但是我真的特别特别后悔，我不该这样的，我知道他不是什么好人，对不起，对不起，我想起来眼泪就停不下来，我好想说点什么可是喉咙里好像卡了块大石头堵着我。眼泪流的太快太多但是似乎无论怎样都没法替你受过一点点......我把mp3放进了你的书包。我还做得特别小心，怕你发现，怕你难为情。后来他站在讲台边说他的mp3不见了，他们翻你的书包，mp3掉出来的时候，我就站在附近看着他们、看着你，你句话都没说，，我也是。对不起我知道你、你根本什么都没拿。因为那个mp3是我放进去的......是他让我放的。\n他骗了我，我觉得太荒唐了，但是，但是对不起我太害怕了，我当时也不敢说，因为我知道他根本也不在意我，他朝我看了一眼，我就把到嘴边的话咽回去了。我很怕、我也怕下个就是我。对不起对不起，是我，我太自私。\n对不起......你什么都没做错。如果那天我没有回那条说说就好了。\n对不起，我是个很笨的人，世界上再没人跟我一般懦弱。',d:'2015-05-10',cm:[{u:'xu',t:'欸我咋在空间写故事？',d:'2015-10-25'}]},],

var CUR_ROUTE=location.hash||'#/feed';

/* 评论随机抽取：keep=1 全量，否则随机 1~全部 */
function pickCm(p){
 var cms=p.cm||[];
 if(p.keep||cms.length<=1)return cms;
 var n=1+Math.floor(Math.random()*cms.length);
 var arr=cms.slice(),out=[];
 while(out.length<n&&arr.length){out.push(arr.splice(Math.floor(Math.random()*arr.length),1)[0]);}
 return out;
}

/* ---- 好友空间：完整历史（FEED 近帖 + 历史帖，按日期倒序） ---- */
var hiddenVisit={};
function renderUser(uid){
 var u=USERS[uid];
 if(!u){go('#/feed');return;}
 $('#views').classList.add('show');$('#app').classList.remove('show');
 document.body.classList.add('dark');fx(true);
 var feedPosts=FEED.filter(function(p){return p.uid===uid;});
 var ownPosts=(SPACE_POSTS[uid]||[]).slice();
 var all=feedPosts.concat(ownPosts);
 all.sort(function(a,b){return postDate(b)<postDate(a)?-1:1;});
 var says=all.map(function(p){
  var cms=pickCm(p).map(function(c){return '<div>'+avatar(c.u,16)+' <b>'+esc(uNick(c.u))+'：</b>'+emj(esc(c.t))+(c.tm?'<span style="color:#9aa7b5;font-size:11px;"> '+c.tm+'</span>':'')+'</div>';}).join('');
  return '<div class="fv-say"><div>'+postHtml(p)+'</div>'+(p.ph?'<div style="margin-top:6px;">'+photoBox(p.ph)+'</div>':'')+
  (p.link?'<div class="fv-link" data-link="'+p.link+'">'+p.linkText+'</div>':'')+
  '<div class="s-time">'+postDate(p)+'</div>'+
  '<div class="s-act"><span class="fs-lk">赞</span><span class="fs-cm">评论</span></div>'+
  (cms?'<div class="fv-cm">'+cms+'</div>':'')+'</div>';
 }).join('')||'<div class="fv-say">该用户暂无说说。</div>';
 var selfVis=!hiddenVisit[uid];
 var others=[['lxd',''],['gcy','']].filter(function(v){return v[0]!==uid;}).slice(0,3);
 var visHtml='<div class="fv-vis">';
 if(selfVis){visHtml+='<span class="fv-v self" data-uid="chen">'+avatar('chen',20,true)+'陈、陌 <i style="color:#1d5a99;font-style:normal;">（今天来过）</i></span>';}
 others.forEach(function(v){visHtml+='<span class="fv-v" data-uid="'+v[0]+'">'+avatar(v[0],20)+esc(uNick(v[0]))+'</span>';});
 visHtml+='</div>';
 var content=
 '<div class="dk-fbanner"><div class="fb-av">'+avatar(uid,64)+'</div><div><div class="dk-fname">'+esc(u.nick)+'</div><div class="dk-fsign">'+(u.sign||'这个人很懒，什么也没留下。')+'</div></div>'+
 '<span class="dk-fback" data-back="1">← 返回好友动态</span></div>'+
 '<div class="dk-content">'+
 '<div class="fv-mod"><div class="fv-t">主人寄语</div>'+(u.sign||'这个人很懒，什么也没留下。')+' ——'+esc(u.nick)+'</div>'+
 '<div class="fv-mod"><div class="fv-t">最近访客</div>'+visHtml+'<div style="margin-top:8px;font-size:11px;color:#8798a9;"><span class="fv-hide" style="color:#1d5a99;cursor:pointer;">'+(selfVis?'隐身访问（黄钻）':'取消隐身')+'</span></div></div>'+
 '<div class="fv-mod"><div class="fv-t">说说</div>'+says+'</div>'+
 '<div class="fv-note">—— 空间访问记录已留下足迹 ——</div></div>';
 $('#views').innerHTML=dkShell('',content);
 $$('#views .fv-v').forEach(function(v){v.addEventListener('click',function(){go('#/user/'+v.getAttribute('data-uid'));});});
 $$('#views .dk-fback').forEach(function(b){b.addEventListener('click',function(){go('#/feed');});});
 $$('#views .fv-hide').forEach(function(h){
  h.addEventListener('click',function(){
   hiddenVisit[uid]=!hiddenVisit[uid];
   toast(hiddenVisit[uid]?'已隐身访问，对方看不到你的足迹':'已取消隐身');
   renderUser(uid);
  });
 });
 $$('#views .fs-lk').forEach(function(el){el.addEventListener('click',function(){el.classList.toggle('on');toast(el.classList.contains('on')?'已赞':'已取消赞');});});
 $$('#views .fv-link').forEach(function(lnk){lnk.addEventListener('click',function(){
   var lk=lnk.getAttribute('data-link')||'';
   var msg=(lk==='map')?'openMap':((lk==='news')?'openNews':'openShuidi');
   try{ window.parent.postMessage({qz:msg},'*'); }catch(e){}
 });});
 if(uid==='lbb'){ try{ window.parent.postMessage({qz:'memo',text:'林斌斌怎么发这种奇奇怪怪的东西，个性签名也怪怪的，他是不是也病了'},'*'); }catch(e){} }
 /* 每次进入任意好友空间都从最新说说所在的页面顶部开始。 */
 window.scrollTo(0,0);
 if(document.scrollingElement) document.scrollingElement.scrollTop=0;
 requestAnimationFrame(function(){
  window.scrollTo(0,0);
  if(document.scrollingElement) document.scrollingElement.scrollTop=0;
 });
}

/* ---- 路由 ---- */
var QZ_RENDER_TIMER=null,QZ_BOOT_TIMER=null,QZ_RENDERED_ROUTE='';
function route(){
 clearTimeout(QZ_BOOT_TIMER);QZ_BOOT_TIMER=null;
 clearTimeout(QZ_RENDER_TIMER);
 var requestedRoute=CUR_ROUTE;
 var h=(CUR_ROUTE||location.hash||'#/feed').replace(/^#\/?/,'')||'feed';
 var seg=h.split('/');
 var dark=false,fn=null;
 if(seg[0]==='feed')fn=renderFeed;
 else if(seg[0]==='home'){fn=renderHome;dark=true;}
 else if(seg[0]==='board'){fn=renderBoard;dark=true;}
 else if(seg[0]==='album'){fn=renderAlbum;dark=true;}
 else if(seg[0]==='blog'){fn=renderBlog;dark=true;}
 else if(seg[0]==='music'){fn=renderMusic;dark=true;}
 else if(seg[0]==='profile'){fn=renderProfile;dark=true;}
 else if(seg[0]==='shuoshuo'){fn=renderShuoshuo;dark=true;}
 else if(seg[0]==='user'&&seg[1]){fn=function(){renderUser(seg[1]);};dark=true;}
 else fn=renderFeed;
 showLoading(dark,320);
 QZ_RENDER_TIMER=setTimeout(function(){
  QZ_RENDER_TIMER=null;
  try{
   fn();QZ_RENDERED_ROUTE=requestedRoute;
   if(window.argQzoneChild)window.argQzoneChild.rendered(requestedRoute);
  }catch(error){if(window.argQzoneChild)window.argQzoneChild.fail(error);throw error;}
 },320);
}
window.addEventListener('hashchange',function(){ if(location.hash)CUR_ROUTE=location.hash; route(); });
document.addEventListener('click',function(e){
 var t=e.target;
 while(t&&t!==document&&!(t.getAttribute&&t.getAttribute('href')))t=t.parentNode;
 if(t&&t.getAttribute&&String(t.getAttribute('href')).charAt(0)==='#'){ e.preventDefault(); go(t.getAttribute('href')); }
});

/* ---- 首次进入：慢加载后默认落在个人中心（好友动态） ---- */
(function boot(){
 var first=!QZ_STORE.getItem('qz_booted');
 if(first)QZ_STORE.setItem('qz_booted','1');
 $('#loading').style.display='flex';
 $('#loadText').textContent='正在连接 qzone.qq.com...';
 QZ_BOOT_TIMER=setTimeout(function(){
  QZ_BOOT_TIMER=null;$('#loading').style.display='none';
  var initial=window.argQzoneChild&&window.argQzoneChild.initialRoute();
  if(initial)CUR_ROUTE=initial;else if(location.hash)CUR_ROUTE=location.hash;
  route();
 },180);
 if(window.argQzoneChild)window.argQzoneChild.bindNavigator(function(r){
  if(CUR_ROUTE===r){if(QZ_RENDERED_ROUTE===r)window.argQzoneChild.rendered(r);return;}
  go(r);
 });
})();
/* 存活标记：脚本完整执行（供父页面检测加载成功与否） */
window.__qzAlive=1;
</script>
